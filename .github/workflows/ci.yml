name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build and test
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies and configure CMake
        run: npm run setup

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Build backend
        run: npm run build:backend

      - name: Check the bundled backend parses
        run: node --check out/main/index.js

      - name: Build renderer
        run: npm run build:renderer

      - name: Backend smoke tests
        run: npm run test:smoke

      - name: Build the native host
        run: npm run build:host
